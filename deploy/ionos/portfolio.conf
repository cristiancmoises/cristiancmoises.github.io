# Production edge configuration loaded by Nginx Proxy Manager/OpenResty.
server {
    listen 80;
    listen [::]:80;
    server_name cristiancezarmoises.com www.cristiancezarmoises.com;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 308 https://cristiancezarmoises.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cristiancezarmoises.com;

    ssl_certificate /etc/letsencrypt/live/cristiancezarmoises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cristiancezarmoises.com/privkey.pem;
    include conf.d/include/ssl-ciphers.conf;

    return 308 https://cristiancezarmoises.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cristiancezarmoises.com;

    ssl_certificate /etc/letsencrypt/live/cristiancezarmoises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cristiancezarmoises.com/privkey.pem;
    include conf.d/include/ssl-ciphers.conf;

    root /data/portfolio/current;
    index index.html;
    error_page 404 /404.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'none'; media-src 'self'; object-src 'none'; frame-src 'none'; connect-src 'self'; worker-src 'none'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* \.(?:css|gif|ico|jpe?g|png|svg|webp|mp4|pdf|7z|zip)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }
}
